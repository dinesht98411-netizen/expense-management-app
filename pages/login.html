<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RAM Infosys Expense Management</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-large">
                    <i class="fas fa-receipt"></i>
                </div>
                <h1>RAM Infosys</h1>
                <p>Expense Management System</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
                    </div>
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <div class="demo-credentials">
                <h4>Demo Credentials</h4>
                <div class="cred-box">
                    <p><strong>Admin:</strong></p>
                    <p>Email: <code>admin@ram-infosys.com</code></p>
                    <p>Password: <code>admin123</code></p>
                </div>
                <div class="cred-box">
                    <p><strong>User:</strong></p>
                    <p>Email: <code>john@ram-infosys.com</code></p>
                    <p>Password: <code>user123</code></p>
                </div>
            </div>

            <p class="login-footer">© 2026 RAM Infosys. Secure Expense Management</p>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
