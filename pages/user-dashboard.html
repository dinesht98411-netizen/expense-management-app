<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - RAM Infosys Expense Management</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-receipt"></i>
                    <span>RAM Infosys</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#dashboard" class="nav-item active" onclick="showSection('dashboard')"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="#submit" class="nav-item" onclick="showSection('submit')"><i class="fas fa-plus-circle"></i> Submit Expense</a></li>
                    <li><a href="#history" class="nav-item" onclick="showSection('history')"><i class="fas fa-history"></i> My Expenses</a></li>
                    <li><a href="#analytics" class="nav-item" onclick="showSection('analytics')"><i class="fas fa-chart-bar"></i> Analytics</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <h2 id="pageTitle">Dashboard</h2>
                <div class="top-bar-right">
                    <span class="user-name" id="userName">User</span>
                    <img src="https://via.placeholder.com/40" alt="Profile" class="profile-pic">
                </div>
            </div>

            <!-- Dashboard Section -->
            <section id="dashboard" class="content-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon pending">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-content">
                            <p class="stat-label">Pending Expenses</p>
                            <h3 id="pendingCount">0</h3>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon approved">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-content">
                            <p class="stat-label">Approved</p>
                            <h3 id="approvedCount">0</h3>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon paid">
                            <i class="fas fa-credit-card"></i>
                        </div>
                        <div class="stat-content">
                            <p class="stat-label">Paid</p>
                            <h3 id="paidCount">0</h3>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon total">
                            <i class="fas fa-rupee-sign"></i>
                        </div>
                        <div class="stat-content">
                            <p class="stat-label">Total Amount</p>
                            <h3 id="totalAmount">₹0</h3>
                        </div>
                    </div>
                </div>

                <div class="recent-expenses">
                    <h3>Recent Expenses</h3>
                    <div id="recentList" class="expense-list"></div>
                </div>
            </section>

            <!-- Submit Expense Section -->
            <section id="submit" class="content-section" style="display:none;">
                <div class="form-container">
                    <h2>Submit New Expense</h2>
                    <form id="expenseForm" class="expense-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="category">Category</label>
                                <select id="category" required>
                                    <option value="">Select Category</option>
                                    <option value="Travel">Travel</option>
                                    <option value="Food">Food</option>
                                    <option value="Supplies">Supplies</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="amount">Amount (₹)</label>
                                <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="date">Date</label>
                                <input type="date" id="date" required>
                            </div>
                            <div class="form-group">
                                <label for="description">Description</label>
                                <input type="text" id="description" placeholder="Brief description" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="receipt">Receipt/Attachment</label>
                            <div class="file-upload">
                                <input type="file" id="receipt" accept="image/*,application/pdf" required>
                                <span><i class="fas fa-cloud-upload-alt"></i> Click to upload or drag & drop</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Submit Expense</button>
                    </form>
                </div>
            </section>

            <!-- History Section -->
            <section id="history" class="content-section" style="display:none;">
                <div class="filter-bar">
                    <select id="statusFilter" onchange="filterExpenses()">
                        <option value="">All Status</option>
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Paid">Paid</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <div id="expensesList" class="expenses-table-container"></div>
            </section>

            <!-- Analytics Section -->
            <section id="analytics" class="content-section" style="display:none;">
                <div class="charts-container">
                    <div class="chart-card">
                        <h3>Spending by Category</h3>
                        <canvas id="categoryChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>Expense Status Distribution</h3>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/expenses.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
