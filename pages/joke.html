<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Random Joke Generator - RAM Infosys</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .joke-page { display:flex; align-items:center; justify-content:center; min-height:80vh; }
    .joke-card { background:white; padding:2rem; border-radius:10px; box-shadow:0 6px 30px rgba(16,24,40,.08); max-width:700px; width:100%; text-align:center }
    .joke-setup { font-size:1.25rem; margin-bottom:.75rem; color:var(--text-dark) }
    .joke-punchline { font-weight:700; color:var(--primary-color); margin-bottom:1rem }
    .joke-controls { display:flex; gap: .5rem; justify-content:center; flex-wrap:wrap }
    .small { padding:.5rem .75rem; font-size:.9rem }
    .muted { color:var(--text-light); font-size:.9rem; margin-bottom:1rem }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <div class="logo"><i class="fas fa-receipt"></i><span>RAM Infosys</span></div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="pages/joke.html">Joke Generator</a></li>
        <li><a href="pages/login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <main class="joke-page">
    <div class="joke-card">
      <h2>Random Joke Generator</h2>
      <p class="muted">Fetches a fresh joke from a public jokes API. Choose type and click "Get Joke".</p>

      <div style="margin-bottom:1rem">
        <label for="apiSelect" class="muted">Joke source</label>
        <select id="apiSelect">
          <option value="official">Official Joke API (setup + punchline)</option>
          <option value="icanhaz">icanhazdadjoke (one-liner)</option>
        </select>
      </div>

      <div id="jokeContent">
        <div id="jokeSetup" class="joke-setup">Click <strong>Get Joke</strong> to load a random joke.</div>
        <div id="jokePunchline" class="joke-punchline"></div>
      </div>

      <div class="joke-controls" style="margin-top:1rem">
        <button id="getJokeBtn" class="btn btn-primary small">Get Joke</button>
        <button id="copyBtn" class="btn btn-secondary small">Copy</button>
        <button id="shareBtn" class="btn btn-success small">Share</button>
      </div>

      <p class="muted" style="margin-top:1rem">Note: This demo calls third-party public APIs. Network required.</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="../js/jokes.js"></script>
</body>
</html>
